# Promote an already-built image to the prod tier. Manual only.
#
# Nothing is rebuilt: prod receives the same image that was tested in dev.
# Leave image_tag blank to promote whatever dev is currently running.

name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote, e.g. sha-<commit>. Blank = whatever dev is running."
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: [self-hosted, lab]
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image
        id: image
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n $TAG ]]; then
            image="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          else
            cid=$(docker ps -q \
              --filter label=com.docker.compose.project=nodegoat-dev \
              --filter label=com.docker.compose.service=web)
            [[ -n $cid ]] || { echo "dev is not running; pass image_tag explicitly" >&2; exit 1; }
            image=$(docker inspect --format '{{.Config.Image}}' "$cid")
          fi
          echo "Promoting $image to prod"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to prod
        run: scripts/deploy.sh prod "${{ steps.image.outputs.image }}"
