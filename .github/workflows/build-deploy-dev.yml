# Build the NodeGoat image once, push it to GHCR, and deploy it to the dev tier.
#
# Build runs on a GitHub-hosted runner (source only). Deploy runs on the
# self-hosted runner in the lab VM, which is the only place NodeGoat ever runs.
# The image built here is the exact artifact that deploy-prod.yml later promotes.
#
# Security scans run alongside the build. Each scanner only records its findings
# and uploads them as an artifact; it never fails the run because of what it
# found. A job fails only if the tool itself errors. The report job combines
# their results and the gate job alone enforces the pass/fail criteria.
#
# The static scans (both SAST tools, secrets, SCA, image) run on GitHub-hosted
# runners unless the repository variable STATIC_RUNNER is "lab", which moves them
# to the self-hosted lab runner. Pull requests always use GitHub-hosted runners, so
# code that hasn't been merged never runs on the lab VM.
#
# Hardening: triggers are push/pull_request only (never pull_request_target, which
# would run fork code with repository secrets). The token defaults to contents:
# read and each job asks only for what it needs. Every action is pinned to a
# full commit SHA, checkouts don't keep the token, and every job has a timeout.

name: build-deploy-dev

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Shared by both Trivy jobs. The binary is checked against this hash.
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ${{ vars.STATIC_RUNNER == 'lab' && github.event_name != 'pull_request' && fromJSON('["self-hosted", "lab"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Official image, pinned by digest, so both runner types run the same build.
      SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
      SEMGREP_RULESETS: "owasp-top-ten javascript nodejsscan"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Snapshot rulesets
        # Registry rulesets are not versioned, so the exact rules used are
        # saved alongside the results.
        run: |
          mkdir -p results/semgrep-rules
          for r in $SEMGREP_RULESETS; do
            curl -sfL "https://semgrep.dev/c/p/$r" -o "results/semgrep-rules/$r.yaml"
          done

      - name: Scan app/
        # Exits 0 when there are findings; non-zero only if the scan itself fails.
        # Runs as the runner's user so its output isn't root-owned on the lab VM;
        # :z relabels the mount for SELinux there and is ignored elsewhere.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src:z" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off \
              $(printf -- '--config results/semgrep-rules/%s.yaml ' $SEMGREP_RULESETS) \
              --json --output results/semgrep.json app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: semgrep-results
          path: results/

  codeql:
    name: SAST (CodeQL)
    # A second SAST tool, for comparison with Semgrep: CodeQL traces data flow
    # (taint tracking) where Semgrep mostly matches patterns. Its licence allows
    # CI use on open-source code hosted on GitHub.com, which this repo is.
    runs-on: ${{ vars.STATIC_RUNNER == 'lab' && github.event_name != 'pull_request' && fromJSON('["self-hosted", "lab"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The official bundle: the CLI plus its query packs, so the rules are
      # pinned along with the binary.
      CODEQL_VERSION: "2.27.3"
      CODEQL_SHA256: "64518dc413c8e7b5733fee2489e830a899bb1e3f28c8873b5869d5cc90164c5c"
      CODEQL_SUITE: codeql/javascript-queries:codeql-suites/javascript-security-extended.qls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install CodeQL
        working-directory: ${{ runner.temp }}
        run: |
          tarball=codeql-bundle-linux64.tar.gz
          curl -sfLO "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_VERSION}/$tarball"
          echo "$CODEQL_SHA256  $tarball" | sha256sum --check
          tar xzf "$tarball"
          rm "$tarball"
          echo "$PWD/codeql" >> "$GITHUB_PATH"

      - name: Scan app/
        # JavaScript needs no build. Exits 0 when there are findings.
        # security-extended: all security queries, including lower-precision ones.
        run: |
          mkdir -p results
          codeql database create "$RUNNER_TEMP/codeql-db" --language=javascript \
            --build-mode=none --source-root=app \
            --codescanning-config=.github/codeql/codeql-config.yml
          codeql database analyze "$RUNNER_TEMP/codeql-db" "$CODEQL_SUITE" \
            --format=sarif-latest --output=results/codeql.sarif
          # The SARIF records the query pack versions; this records the CLI's.
          codeql version --format=json > results/codeql-version.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-results
          path: results/

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ${{ vars.STATIC_RUNNER == 'lab' && github.event_name != 'pull_request' && fromJSON('["self-hosted", "lab"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history: a secret deleted in a later commit has still leaked.
          fetch-depth: 0

      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum --check
          tar xzf "$tarball" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan git history
        # --exit-code 0 records findings without failing the job.
        # --redact keeps secret values out of the log and the artifact.
        run: |
          mkdir -p results
          gitleaks git --no-banner --redact --exit-code 0 \
            --report-format json --report-path results/gitleaks.json .
          # The report doesn't say which version produced it.
          gitleaks version > results/gitleaks-version.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gitleaks-results
          path: results/

  sca:
    name: SCA (Trivy)
    runs-on: ${{ vars.STATIC_RUNNER == 'lab' && github.event_name != 'pull_request' && fromJSON('["self-hosted", "lab"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        working-directory: ${{ runner.temp }}
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $tarball" | sha256sum --check
          tar xzf "$tarball" trivy
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan app/ dependencies
        # Reads app/package-lock.json. Dev dependencies are excluded by default,
        # matching the image's `npm install --production`. Exits 0 with findings.
        # The DB cache is per job, so the lab runner doesn't reuse an older DB.
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          mkdir -p results
          trivy fs --scanners vuln --no-progress --skip-version-check \
            --format json --output results/trivy-deps.json app
          # The vulnerability DB is rebuilt daily and isn't versioned, so
          # record which one this scan used.
          trivy version --format json > results/trivy-db.json

      - name: SBOM of app/ dependencies
        # A separate run, so the scan above stays comparable with earlier runs.
        # CycloneDX output lists components only; it needs no vulnerability DB.
        run: |
          trivy fs --format cyclonedx --no-progress --skip-version-check \
            --output results/sbom-deps.cdx.json app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-deps-results
          path: results/

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # the only job that pushes to GHCR
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        # GHCR requires lowercase repository names.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: push
        with:
          context: app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-scan:
    name: Container image (Trivy)
    needs: build
    # Scans the image as pushed to GHCR; on pull requests nothing is pushed.
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.STATIC_RUNNER == 'lab' && github.event_name != 'pull_request' && fromJSON('["self-hosted", "lab"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Trivy
        working-directory: ${{ runner.temp }}
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $tarball" | sha256sum --check
          tar xzf "$tarball" trivy
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan pushed image
        # Pulled by digest straight from the registry, so the scan covers exactly
        # the bytes that deploy-dev runs and deploy-prod promotes.
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          mkdir -p results
          trivy image --image-src remote --scanners vuln --no-progress --skip-version-check \
            --format json --output results/trivy-image.json "${IMAGE%:*}@${DIGEST}"
          trivy version --format json > results/trivy-db.json

      - name: SBOM of the pushed image
        # Same digest as the scan above; a separate run for the same reason as in sca.
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy image --image-src remote --format cyclonedx --no-progress --skip-version-check \
            --output results/sbom-image.cdx.json "${IMAGE%:*}@${DIGEST}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-image-results
          path: results/

  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lab]
    timeout-minutes: 10
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to dev
        run: scripts/deploy.sh dev "${{ needs.build.outputs.image }}"

  dast:
    name: DAST (ZAP baseline)
    needs: [build, deploy-dev]
    runs-on: [self-hosted, lab]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Pinned by digest; -silent below stops ZAP updating add-ons at scan time,
      # so the scan rules are exactly those baked into this image.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
      EXPECTED_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Check dev is running this build
        id: target
        run: |
          cid=$(docker ps -q \
            --filter label=com.docker.compose.project=nodegoat-dev \
            --filter label=com.docker.compose.service=web)
          [[ -n $cid ]] || { echo "::error::dev is not running"; exit 1; }
          running=$(docker inspect --format '{{.Config.Image}}' "$cid")
          if [[ $running != "$EXPECTED_IMAGE" ]]; then
            echo "::error::dev is running $running, expected $EXPECTED_IMAGE"
            exit 1
          fi
          network=$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$cid")
          echo "Scanning $running via network $network"
          echo "network=$network" >> "$GITHUB_OUTPUT"

      - name: Check NodeGoat is bound to loopback only
        run: |
          docker ps --filter label=com.docker.compose.service=web \
            --format '{{.Label "com.docker.compose.project"}}: {{.Ports}}' | tee "$RUNNER_TEMP/ports.txt"
          if grep -oE '[^ ,]+->' "$RUNNER_TEMP/ports.txt" | grep -qv '^127\.0\.0\.1:'; then
            echo "::error::a NodeGoat port is published beyond 127.0.0.1"
            exit 1
          fi

      - name: ZAP baseline scan
        # ZAP joins the dev tier's own Docker network and scans the app container
        # directly, so it publishes no port on the VM.
        env:
          NETWORK: ${{ steps.target.outputs.network }}
        run: |
          out="$RUNNER_TEMP/zap"
          mkdir -p "$out" && chmod 777 "$out"
          docker pull -q "$ZAP_IMAGE"
          # Record exactly which scan rule add-ons this image contains.
          docker run --rm --entrypoint ls "$ZAP_IMAGE" /zap/plugin > "$out/zap-addons.txt"
          rc=0
          docker run --rm --network "$NETWORK" -v "$out:/zap/wrk:rw,z" "$ZAP_IMAGE" \
            zap-baseline.py -t http://web:4000 -z "-silent" \
              -J zap-report.json -r zap-report.html || rc=$?
          # 1 = FAIL alerts, 2 = WARN alerts: findings, recorded not enforced.
          # 3 = ZAP itself failed.
          echo "zap-baseline exit code: $rc"
          [[ $rc -le 2 ]] || exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: zap-results
          path: ${{ runner.temp }}/zap/

  report:
    name: Report (aggregate)
    needs: [sast, codeql, secrets, sca, image-scan, dast]
    # Runs even when a scan job failed or was skipped. A failed scan uploads
    # nothing, and a missing result fails this job as an input error.
    # Fails only if reporting itself fails; the verdict goes to the gate job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # previous run's aggregate-results
    outputs:
      verdict: ${{ steps.aggregate.outputs.verdict }}
      blocking: ${{ steps.aggregate.outputs.blocking }}
      fail_on: ${{ steps.aggregate.outputs.fail_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test aggregate.py
        run: python3 -m unittest discover -s tests

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          # One folder per artifact; excludes the build cache artifact.
          pattern: "*-results"
          path: results

      - name: Fetch previous run's results
        # For the "changes since the previous run" section: the newest
        # aggregate-results from another run on main. If there is none (first
        # run, or the artifact expired), that section says so.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=aggregate-results&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not)
                   | select(.workflow_run.head_branch == \"main\" and .workflow_run.id != $GITHUB_RUN_ID)]
                  | sort_by(.created_at) | last | .workflow_run.id // empty")
          if [[ -n $prev ]]; then
            gh run download "$prev" -R "$GITHUB_REPOSITORY" -n aggregate-results -D previous
            echo "Comparing with run $prev"
          else
            echo "No previous run to compare with"
          fi

      - name: Aggregate
        id: aggregate
        # Exit 2 = a result is missing or unreadable. The image scan and DAST
        # run only for main, so elsewhere they are reported as not run.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          args=()
          [[ $EVENT == pull_request ]] && args+=(--not-run image)
          [[ $EVENT == pull_request || $REF != refs/heads/main ]] && args+=(--not-run dast)
          [[ -f previous/aggregated.json ]] && args+=(--previous previous/aggregated.json)
          python3 scripts/aggregate.py results --report-only "${args[@]}"
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          r = json.load(open("results/aggregated.json"))
          print(f"verdict={r['gate']}")
          print(f"blocking={json.dumps(r['blocking'])}")
          print(f"fail_on={'/'.join(r['fail_on'])}")
          PY

      - name: Job summary
        if: always()
        run: |
          if [[ -f results/aggregated-report.md ]]; then
            cat results/aggregated-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: aggregate-results
          path: |
            results/aggregated-report.md
            results/aggregated.json
          if-no-files-found: ignore

  gate:
    name: Security gate
    needs: report
    # Enforces the verdict the report job computed (criteria: aggregate.py).
    # Runs after a failed report too, so the gate never shows as skipped
    # when no verdict exists.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce verdict
        env:
          VERDICT: ${{ needs.report.outputs.verdict }}
          BLOCKING: ${{ needs.report.outputs.blocking }}
          FAIL_ON: ${{ needs.report.outputs.fail_on }}
        run: |
          case $VERDICT in
            pass) echo "Gate passed: no $FAIL_ON findings" ;;
            fail) echo "::error::Gate failed: $FAIL_ON findings by stage: $BLOCKING"
                  exit 1 ;;
            *)    echo "::error::No verdict: the report job did not complete"
                  exit 1 ;;
          esac
