# Build the NodeGoat image once, push it to GHCR, and deploy it to the dev tier.
#
# Build runs on a GitHub-hosted runner (source only). Deploy runs on the
# self-hosted runner in the lab VM, which is the only place NodeGoat ever runs.
# The image built here is the exact artifact that deploy-prod.yml later promotes.
#
# Security scans run alongside the build on GitHub-hosted runners. Each scanner
# only records its findings and uploads them as an artifact; it never fails the
# run because of what it found. A job fails only if the tool itself errors.
# The aggregate job alone applies the pass/fail gate to all of them.

name: build-deploy-dev

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Shared by both Trivy jobs. The binary is checked against this hash.
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SEMGREP_VERSION: "1.180.0"
      SEMGREP_RULESETS: "owasp-top-ten javascript nodejsscan"
    steps:
      - uses: actions/checkout@v7

      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      - name: Snapshot rulesets
        # Registry rulesets are not versioned, so the exact rules used are
        # saved alongside the results.
        run: |
          mkdir -p results/semgrep-rules
          for r in $SEMGREP_RULESETS; do
            curl -sfL "https://semgrep.dev/c/p/$r" -o "results/semgrep-rules/$r.yaml"
          done

      - name: Scan app/
        # Exits 0 when there are findings; non-zero only if the scan itself fails.
        run: |
          semgrep scan --metrics=off \
            $(printf -- '--config results/semgrep-rules/%s.yaml ' $SEMGREP_RULESETS) \
            --json --output results/semgrep.json app

      - uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: results/

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret deleted in a later commit has still leaked.
          fetch-depth: 0

      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum --check
          tar xzf "$tarball" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan git history
        # --exit-code 0 records findings without failing the job.
        # --redact keeps secret values out of the log and the artifact.
        run: |
          mkdir -p results
          gitleaks git --no-banner --redact --exit-code 0 \
            --report-format json --report-path results/gitleaks.json .

      - uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results
          path: results/

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        working-directory: ${{ runner.temp }}
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $tarball" | sha256sum --check
          tar xzf "$tarball" trivy
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan app/ dependencies
        # Reads app/package-lock.json. Dev dependencies are excluded by default,
        # matching the image's `npm install --production`. Exits 0 with findings.
        run: |
          mkdir -p results
          trivy fs --scanners vuln --no-progress --skip-version-check \
            --format json --output results/trivy-deps.json app
          # The vulnerability DB is rebuilt daily and isn't versioned, so
          # record which one this scan used.
          trivy version --format json > results/trivy-db.json

      - uses: actions/upload-artifact@v7
        with:
          name: trivy-deps-results
          path: results/

  build:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: name
        # GHCR requires lowercase repository names.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-scan:
    name: Container image (Trivy)
    needs: build
    # Scans the image as pushed to GHCR; on pull requests nothing is pushed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Trivy
        working-directory: ${{ runner.temp }}
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $tarball" | sha256sum --check
          tar xzf "$tarball" trivy
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan pushed image
        # Pulled by digest straight from the registry, so the scan covers exactly
        # the bytes that deploy-dev runs and deploy-prod promotes.
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          trivy image --image-src remote --scanners vuln --no-progress --skip-version-check \
            --format json --output results/trivy-image.json "${IMAGE%:*}@${DIGEST}"
          trivy version --format json > results/trivy-db.json

      - uses: actions/upload-artifact@v7
        with:
          name: trivy-image-results
          path: results/

  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lab]
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to dev
        run: scripts/deploy.sh dev "${{ needs.build.outputs.image }}"

  dast:
    name: DAST (ZAP baseline)
    needs: [build, deploy-dev]
    runs-on: [self-hosted, lab]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Pinned by digest; -silent below stops ZAP updating add-ons at scan time,
      # so the scan rules are exactly those baked into this image.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
      EXPECTED_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Check dev is running this build
        id: target
        run: |
          cid=$(docker ps -q \
            --filter label=com.docker.compose.project=nodegoat-dev \
            --filter label=com.docker.compose.service=web)
          [[ -n $cid ]] || { echo "::error::dev is not running"; exit 1; }
          running=$(docker inspect --format '{{.Config.Image}}' "$cid")
          if [[ $running != "$EXPECTED_IMAGE" ]]; then
            echo "::error::dev is running $running, expected $EXPECTED_IMAGE"
            exit 1
          fi
          network=$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$cid")
          echo "Scanning $running via network $network"
          echo "network=$network" >> "$GITHUB_OUTPUT"

      - name: Check NodeGoat is bound to loopback only
        run: |
          docker ps --filter label=com.docker.compose.service=web \
            --format '{{.Label "com.docker.compose.project"}}: {{.Ports}}' | tee "$RUNNER_TEMP/ports.txt"
          if grep -oE '[^ ,]+->' "$RUNNER_TEMP/ports.txt" | grep -qv '^127\.0\.0\.1:'; then
            echo "::error::a NodeGoat port is published beyond 127.0.0.1"
            exit 1
          fi
          echo "Listening TCP sockets on the lab VM:"
          ss -tln

      - name: ZAP baseline scan
        # ZAP joins the dev tier's own Docker network and scans the app container
        # directly, so it publishes no port on the VM.
        env:
          NETWORK: ${{ steps.target.outputs.network }}
        run: |
          out="$RUNNER_TEMP/zap"
          mkdir -p "$out" && chmod 777 "$out"
          docker pull -q "$ZAP_IMAGE"
          # Record exactly which scan rule add-ons this image contains.
          docker run --rm --entrypoint ls "$ZAP_IMAGE" /zap/plugin > "$out/zap-addons.txt"
          rc=0
          docker run --rm --network "$NETWORK" -v "$out:/zap/wrk:rw,z" "$ZAP_IMAGE" \
            zap-baseline.py -t http://web:4000 -z "-silent" \
              -J zap-report.json -r zap-report.html || rc=$?
          # 1 = FAIL alerts, 2 = WARN alerts: findings, recorded not enforced.
          # 3 = ZAP itself failed.
          echo "zap-baseline exit code: $rc"
          [[ $rc -le 2 ]] || exit "$rc"

      - uses: actions/upload-artifact@v7
        with:
          name: zap-results
          path: ${{ runner.temp }}/zap/

  aggregate:
    name: Aggregate + gate
    needs: [sast, secrets, sca, image-scan, dast]
    # Runs even when a scan job failed or was skipped. A failed scan uploads
    # nothing, and a missing result fails the gate as an input error.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Test aggregate.py
        run: python3 -m unittest discover -s tests

      - uses: actions/download-artifact@v8
        with:
          # One folder per artifact; excludes the build cache artifact.
          pattern: "*-results"
          path: results

      - name: Aggregate and apply gate
        # Exit 1 = gate failed (any Critical/High), 2 = a result is missing or
        # unreadable. The image scan and DAST run only for main, so elsewhere
        # they are reported as not run instead of missing.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          not_run=()
          [[ $EVENT == pull_request ]] && not_run+=(--not-run image)
          [[ $EVENT == pull_request || $REF != refs/heads/main ]] && not_run+=(--not-run dast)
          python3 scripts/aggregate.py results "${not_run[@]}"

      - name: Job summary
        if: always()
        run: |
          if [[ -f results/aggregated-report.md ]]; then
            cat results/aggregated-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aggregate-results
          path: |
            results/aggregated-report.md
            results/aggregated.json
          if-no-files-found: ignore
