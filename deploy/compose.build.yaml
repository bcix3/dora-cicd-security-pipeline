# Override for building NodeGoat from source on the lab VM instead of pulling
# from the registry. Useful for the first bring-up and for debugging:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml \
#     --env-file deploy/env/dev.env up -d --build

services:
  web:
    image: nodegoat:local
    build: ../app
