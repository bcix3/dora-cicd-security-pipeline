# One compose file for every tier. The tier is chosen by its env file
# (deploy/env/<tier>.env), which also sets the compose project name, so dev and
# prod get separate containers, networks and MongoDB volumes on the same host.
#
#   docker compose -f deploy/compose.yaml --env-file deploy/env/dev.env up -d
#
# NODEGOAT_IMAGE is set by scripts/deploy.sh to the registry image being
# deployed; it defaults to the locally built tag from compose.build.yaml.

name: nodegoat-${TIER:?set TIER via deploy/env/<tier>.env}

services:
  web:
    image: ${NODEGOAT_IMAGE:-nodegoat:local}
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/nodegoat
    # Upstream's start command: wait for Mongo, reseed the database, start the
    # app. Reseeding on every start gives each deploy (and each test run) the
    # same known state.
    command: sh -c "until nc -z -w 2 mongo 27017 && node artifacts/db-reset.js && npm start; do sleep 2; done"
    ports:
      # Loopback only: NodeGoat must never be reachable from outside the lab VM.
      - "127.0.0.1:${APP_PORT:?set APP_PORT via deploy/env/<tier>.env}:4000"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    user: mongodb
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
